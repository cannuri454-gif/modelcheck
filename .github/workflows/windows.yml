name: Windows tests and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Check application source
        run: python -m bandit -r modelcheck run.py tools
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt
      - name: Build development folder
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ModelCheck --exclude-module matplotlib --exclude-module pytest run.py
      - name: Preserve dependency notices
        run: python tools/collect_licenses.py dist/ModelCheck
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ModelCheck-Windows-development
          path: dist/ModelCheck/
